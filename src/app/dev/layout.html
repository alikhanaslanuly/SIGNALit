<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGNALit development layout audit</title><style>
body{margin:0;padding:16px;background:#e4ebef;color:#142f3c;font:14px system-ui}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}button,input{font:inherit;min-height:44px;border:1px solid #b1c4cf;background:white;border-radius:5px;padding:8px 12px}input{flex:1;min-width:220px}button[aria-pressed=true]{background:#096f73;color:white}output{display:block;padding:12px;background:white;margin:12px 0;border:1px solid #b1c4cf}#frame-wrap{position:relative;margin:auto}iframe{height:850px;border:0;transform-origin:top left;background:white}h1{font-size:18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
</style></head><body><h1>SIGNALit · Development layout audit</h1><header><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1024">1024 px</button><button data-width="1440">1440 px</button><input aria-label="Route" id="route" value="/dashboard"><button id="open">Open route</button></header><nav><button data-route="/">Entry</button><button data-route="/patient">Patient chooser</button><button id="patient-session">Patient session (mock)</button><button data-route="/dashboard">Overview</button><button data-route="/dashboard/requests">Requests</button><button data-route="/dashboard/patients">Patients</button><button data-route="/dashboard/dialog">Dialog</button><button data-route="/dashboard/quality">Quality</button></nav><button id="sweep">Run route and width audit</button><pre id="audit" style="white-space:pre-wrap"></pre><output id="result" aria-live="polite">Loading…</output><div id="frame-wrap"><iframe id="frame" title="SIGNALit route under test"></iframe></div><script type="module">
const frame=document.querySelector('#frame'),wrapper=document.querySelector('#frame-wrap'),route=document.querySelector('#route'),result=document.querySelector('#result');let width=390;let errors=0;
function fit(){const scale=Math.min(1,(innerWidth-32)/width);frame.style.width=width+'px';frame.style.transform=`scale(${scale})`;wrapper.style.width=width*scale+'px';wrapper.style.height=850*scale+'px';document.querySelectorAll('[data-width]').forEach(button=>button.setAttribute('aria-pressed',String(+button.dataset.width===width)));}
function open(){errors=0;frame.src=route.value;}
document.querySelector('#patient-session').onclick=()=>{const id=new URLSearchParams(location.search).get('patientId');if(id){route.value=`/patient?patientId=${encodeURIComponent(id)}&debug=1`;open();}};
document.querySelector('#sweep').onclick=async()=>{const button=document.querySelector('#sweep'),audit=document.querySelector('#audit');button.disabled=true;audit.textContent='';const patientId=new URLSearchParams(location.search).get('patientId');const results=[];const routes=['/','/register','/patient','/dashboard','/dashboard/requests','/dashboard/patients','/dashboard/dialog','/dashboard/quality',...(patientId?[`/patient?patientId=${patientId}`,`/dashboard/patients/${patientId}`]:[])];for(const path of routes){for(const size of [390,768,1024,1440]){width=size;fit();route.value=path;await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});open();});await new Promise(resolve=>setTimeout(resolve,650));const doc=frame.contentDocument;const overflow=doc.documentElement.scrollWidth>frame.contentWindow.innerWidth;results.push({path,size,overflow,main:!!doc.querySelector('main'),errors});audit.textContent+=`${path} @ ${size}: ${overflow?'OVERFLOW':'PASS'}; main=${!!doc.querySelector('main')}; observed errors=${errors}\n`;}}audit.textContent=`SUMMARY: ${results.length} checks; ${results.filter(row=>row.overflow).length} overflows; ${results.filter(row=>!row.main).length} blank main regions; ${results.reduce((sum,row)=>sum+row.errors,0)} observed errors. Widths: 390 / 768 / 1024 / 1440.\n`+audit.textContent;button.disabled=false;};
function report(){try{const doc=frame.contentDocument,w=frame.contentWindow;result.textContent=`${w.location.pathname} · viewport ${w.innerWidth}px · document ${doc.documentElement.scrollWidth}px · ${doc.documentElement.scrollWidth<=w.innerWidth?'NO HORIZONTAL OVERFLOW':'OVERFLOW'} · uncaught errors ${errors}`;}catch{result.textContent='Unable to inspect this origin';}}
frame.addEventListener('load',()=>{frame.contentWindow.addEventListener('error',()=>errors++);frame.contentWindow.addEventListener('unhandledrejection',()=>errors++);report();});document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{width=+button.dataset.width;fit();});document.querySelectorAll('[data-route]').forEach(button=>button.onclick=()=>{route.value=button.dataset.route;open();});document.querySelector('#open').onclick=open;addEventListener('resize',fit);setInterval(report,500);fit();open();
</script></body></html>
