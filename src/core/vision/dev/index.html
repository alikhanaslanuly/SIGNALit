<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGNAL Vision check</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 24px; max-width: 960px; background: #f8fafc; color: #17233d; }
    button, input { font: inherit; padding: 9px 13px; margin: 4px; }
    button { cursor: pointer; }
    .preview { position: relative; max-width: 640px; aspect-ratio: 4 / 3; background: #17233d; overflow: hidden; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    video { transform: scaleX(-1); }
    canvas { pointer-events: none; }
    output { display: block; margin: 10px 0; }
    #scores { white-space: pre-wrap; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>SIGNAL Vision check</h1>
  <p>Кадры остаются на этом устройстве. Нажмите «Запустить», разрешите камеру и покажите жест перед объективом.</p>
  <button id="start">Запустить камеру</button><button id="stop">Остановить</button>
  <output id="status">Ожидание</output>
  <div class="preview"><video id="video" autoplay muted playsinline></video><canvas id="canvas" width="640" height="480"></canvas></div>
  <output id="metrics">Нет кадров</output>
  <output id="recognition">none</output>
  <output id="scores"></output>
  <h2>Запись признаков для настройки</h2>
  <label>Код участника <input id="participant" value="p1"></label>
  <div>
    <button data-gesture="YES">👍 YES</button><button data-gesture="NO">👎 NO</button>
    <button data-gesture="HELP">✋ HELP</button><button data-gesture="PAIN">✊ PAIN</button>
    <button data-gesture="TOILET">☝️ TOILET</button><button data-gesture="WATER">3 пальца WATER</button>
  </div>
  <output id="counts">Нет записей</output>
  <button id="download">Скачать JSON признаков</button>
  <script type="module" src="./main.ts"></script>
</body>
</html>
